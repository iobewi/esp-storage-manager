[package]
name = "esp-flash-access"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Shared ESP storage hardware backend for bare-metal Rust"
repository = "https://github.com/iobewi/esp-storage-manager"
readme = "README.md"
keywords = ["esp32", "flash", "nvs", "embedded", "no-std"]
categories = ["embedded", "hardware-support", "no-std"]

[features]
default = []
esp32c3 = [
  "esp-hal/esp32c3",
  "esp-storage/esp32c3",
  "esp-nvs/esp32c3",
  "esp-bootloader-esp-idf/esp32c3",
]
esp32s3 = [
  "esp-hal/esp32s3",
  "esp-storage/esp32s3",
  "esp-nvs/esp32s3",
  "esp-bootloader-esp-idf/esp32s3",
]

[dependencies]
embassy-sync = "0.8.0"
embedded-storage = "0.3.1"
esp-hal = { version = "~1.1.0", default-features = false, features = ["unstable"] }
esp-storage = "0.9.0"
esp-nvs = { version = "0.5.0", default-features = false }
esp-bootloader-esp-idf = { version = "0.5.0", default-features = false }
static_cell = "2.1.1"
