[package]
name = "esp-storage-manager"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Single-owner ESP flash and cached NVS coordination for bare-metal Rust"
repository = "https://github.com/iobewi/esp-storage-manager"
readme = "README.md"
keywords = ["esp32", "flash", "nvs", "embedded", "no-std"]
categories = ["embedded", "hardware-support", "no-std"]

[features]
default = []
esp32c3 = ["esp-hal/esp32c3", "esp-storage/esp32c3", "esp-nvs/esp32c3"]
esp32s3 = ["esp-hal/esp32s3", "esp-storage/esp32s3", "esp-nvs/esp32s3"]

[dependencies]
esp-hal = { version = "~1.1.0", default-features = false, features = ["unstable"] }
esp-storage = { version = "0.9.0" }
esp-nvs = { version = "0.5.0" }
embedded-storage = "0.3.1"
static_cell = "2.1.1"
log = { version = "0.4.29", default-features = false }
